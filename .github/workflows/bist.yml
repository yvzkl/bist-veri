# Yatırım Ajanı — günlük piyasa verisi (BIST 100 + 30 ABD hissesi + 15 kripto)
# Bu dosyanın repodaki yeri: .github/workflows/bist.yml
name: Piyasa verisi

on:
  schedule:
    # GitHub zamanlanmış işleri yoğun saatlerde saatlerce geciktirebiliyor (18-19.11.2026'da 7-8,5 saat).
    # Bu yüzden saat başı olmayan dakikalarda birden çok deneme var; amaç, sabah raporundan (05:37 UTC) önce
    # en az birinin bitmesi. Aynı anda iki çalışma olmaz (concurrency); veri değişmediyse kayıt yapılmaz.
    - cron: "17 16 * * 1-5"  # Pzt–Cum 19:17 İstanbul (BIST kapanışından sonra)
    - cron: "43 18 * * 1-5"  # Pzt–Cum 21:43 İstanbul (yedek)
    - cron: "23 0 * * *"     # Her gün 03:23 İstanbul: ABD ve kripto dahil tüm kapanmış günler
    - cron: "41 1 * * *"     # Her gün 04:41 İstanbul (yedek)
    - cron: "11 3 * * *"     # Her gün 06:11 İstanbul (yedek)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

concurrency:
  group: piyasa-verisi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yfinance
      - run: python3 bist_cek.py bist-veri.txt
      - name: Kaydet
        run: |
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add bist-veri.txt makro-gunluk.txt
          git commit -m "Piyasa verisi $(date -u +%F)" || echo "degisiklik yok"
          git pull --rebase
          git push
